[pytest]
# Pytest configuration for v4 test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 6.0

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for test categorization
markers =
    database: Database tool tests
    collection: Collection tool tests
    view: View tool tests
    graph: Graph tool tests
    aql: AQL tool tests
    mcp: MCP metadata tool tests
    integration: Integration tests (require real ArangoDB)
    unit: Unit tests (mocked dependencies)
    crud: CRUD operation tests
    batch: Batch operation tests
    traversal: Graph traversal tests
    search: Search operation tests

# Coverage options
[coverage:run]
source = mcp_arangodb_async
omit =
    */tests/*
    */archive/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
